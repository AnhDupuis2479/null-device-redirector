[project]
name = "null-device-redirector"
version = "0.1.1"
description = "Context manager redirecting stdout and stderr to os.devnull and restoring them on exit."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
